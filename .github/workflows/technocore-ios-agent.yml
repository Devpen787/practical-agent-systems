name: Technocore iOS Agent

on:
  push:
    paths:
      - "examples/technocore-ios-agent/**"
      - ".github/workflows/technocore-ios-agent.yml"
  pull_request:
    paths:
      - "examples/technocore-ios-agent/**"
      - ".github/workflows/technocore-ios-agent.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: examples/technocore-ios-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: examples/technocore-ios-agent/requirements.txt

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run cryptographic self-test
        run: python technocore_agent.py self-test

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Verify example proof
        run: python technocore_agent.py verify-proof public-proof.example.json

      - name: Scan contribution for private material
        run: python technocore_agent.py scan --root .
