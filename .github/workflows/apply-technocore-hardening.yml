name: Apply Technocore hardening

on:
  push:
    branches:
      - feat/technocore-ios-agent
    paths:
      - "examples/technocore-ios-agent/hardening_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check -r examples/technocore-ios-agent/requirements.txt

      - name: Apply reviewed hardening patch
        run: python examples/technocore-ios-agent/hardening_patch.py

      - name: Verify hardened implementation
        working-directory: examples/technocore-ios-agent
        run: |
          python technocore_agent.py self-test
          PYTHONPATH=. python -m unittest discover -s tests -v
          python technocore_agent.py verify-proof public-proof.example.json
          python technocore_agent.py scan --root .

      - name: Commit hardened files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Patch made no changes"; exit 1; }
          git commit -m "Harden Technocore identity and readback"
          git push origin "HEAD:${{ github.ref_name }}"
